    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        
        /* THE PRINT ENGINE FIXES */
        @media print {
            /* 1. Reset Environment */
            html, body {
                height: auto !important;
                overflow: visible !important;
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* 2. Hide Navigation UI */
            aside, header, nav, .no-print, button, [role="button"], .modal-close-btn {
                display: none !important;
            }

            /* 3. Re-orient Main Content */
            main {
                margin: 0 !important;
                padding: 1cm !important;
                width: 100% !important;
                position: static !important;
                display: block !important;
            }

            /* 4. Fix Modals (The fixed/inset problem) */
            .fixed.inset-0 {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: auto !important;
                background: white !important;
                display: block !important;
                z-index: auto !important;
                padding: 0 !important;
                box-shadow: none !important;
            }

            .overflow-y-auto {
                overflow: visible !important;
                height: auto !important;
                max-height: none !important;
            }

            /* 5. Formatting Tables */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                page-break-inside: auto !important;
            }
            tr { page-break-inside: avoid !important; page-break-after: auto !important; }
            th, td { border: 1px solid #eee !important; padding: 8px !important; }

            /* 6. Branding Purity */
            .bg-emerald-800 {
                background-color: #064e3b !important;
                color: white !important;
            }
            .bg-emerald-600 { background-color: #059669 !important; color: white !important; }
            
            /* Ensure printed cards don't have shadows */
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl {
                box-shadow: none !important;
            }
        }

        @media all and (display-mode: standalone) {
            .app-header { padding-top: 1rem; }
            body { background-color: #ffffff; }
        }
    </style>
